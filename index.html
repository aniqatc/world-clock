<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />

		<!-- Standard SEO-related meta tags for search engines -->
		<meta
			name="description"
			content="Minimalistic analog and digital time dashboard featuring over 550 timezones." />
		<meta
			name="keywords"
			content="world clock, timezones, date and time, analog clock, digital clock" />
		<meta
			name="author"
			content="Aniqa" />

		<!-- Open Graph meta tags for social media sharing -->
		<meta
			property="og:title"
			content="World Clock" />
		<meta
			property="og:description"
			content="Minimalistic analog and digital time dashboard featuring over 550 timezones." />
		<meta
			property="og:image"
			content="https://raw.githubusercontent.com/aniqatc/world-clock/main/assets/og-img.png" />
		<meta
			property="og:url"
			content="https://clock.aniqa.dev" />
		<meta
			property="og:type"
			content="website" />
		<meta
			property="og:site_name"
			content="World Clock" />
		<meta
			property="og:locale"
			content="en_US" />

		<!-- Twitter-specific meta tags -->
		<meta
			name="twitter:card"
			content="summary_large_image" />
		<meta
			property="twitter:site"
			content="@aniqatc" />
		<meta
			property="twitter:image"
			content="https://raw.githubusercontent.com/aniqatc/world-clock/main/assets/og-img.png" />
		<meta
			name="twitter:image:alt"
			content="Screenshot of minimalistic time dashboard with analog and digital clock." />
		<title>World Clock</title>

		<!-- Links to CSS styling, custom/web fonts, favicon, icons, frameworks -->
		<link
			rel="icon"
			type="image/svg+xml"
			href="/assets/favicon.svg" />
		<link
			rel="stylesheet"
			href="/src/styles.css" />
		<link
			rel="manifest"
			href="manifest.json" />

		<!-- Fonts & Icons -->
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com" />
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&family=DM+Mono:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,100;9..40,200;9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900;9..40,1000&display=swap"
			rel="stylesheet" />
		<link
			href="https://fonts.cdnfonts.com/css/cursed-timer-ulil"
			rel="stylesheet" />

		<!-- Moment.js -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data-1970-2030.min.js"></script>

		<!-- Main JS -->
		<script
			defer
			src="/src/script.js"></script>
	</head>
	<body>
		<aside>
			<div class="option-button-group">
				<button
					type="button"
					class="option-button"
					id="search-toggle-btn"
					aria-expanded="false"
					aria-controls="search-wrapper">
					Find a City <kbd id="search-shortcut">Ctrl K</kbd>
				</button>
				<button
					type="button"
					class="option-button option-button--icon"
					id="user-tz-btn"
					aria-label="Show my time zone">
					<svg
						width="16"
						height="16"
						viewBox="0 0 24 24"
						aria-hidden="true">
						<path
							d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"
							fill="currentColor" />
					</svg>
				</button>
			</div>
			<div
				class="search-wrapper"
				id="search-wrapper"
				hidden>
				<label
					for="city-search"
					class="visually-hidden"
					>Search for a city or time zone</label
				>
				<input
					class="tz-search"
					id="city-search"
					type="search"
					list="city-list"
					placeholder="Search 500+ cities and time zones"
					autocomplete="off" />
				<datalist id="city-list"></datalist>
			</div>
		</aside>
		<main>
			<section
				class="time-card-wrapper"
				id="time-card">
				<div class="time-card--heading">
					<h1>Your Location</h1>
					<h2>Time Card</h2>
				</div>
				<div class="clock-wrapper">
					<svg
						class="clock--analog"
						viewBox="-130 -130 260 340"
						role="img"
						aria-label="Analog and digital clock">
						<rect
							class="clock--digital-bg"
							height="210"
							width="260"
							x="-130"
							y="0" />
						<circle
							class="clock--ring-minutes"
							r="120"
							pathlength="60" />
						<circle
							class="clock--border"
							cx="0"
							cy="0"
							r="125" />
						<text
							class="clock--text-hours"
							x="0"
							y="-95"
							text-anchor="middle">
							12
						</text>
						<text
							class="clock--text-hours"
							x="105"
							y="5"
							text-anchor="middle">
							3
						</text>
						<text
							class="clock--text-hours"
							x="0"
							y="105"
							text-anchor="middle">
							6
						</text>
						<text
							class="clock--text-hours"
							x="-105"
							y="5"
							text-anchor="middle">
							9
						</text>
						<g transform="rotate(30)">
							<line
								class="clock--ring-hours"
								x1="0"
								y1="-100"
								x2="0"
								y2="-125" />
						</g>
						<g transform="rotate(60)">
							<line
								class="clock--ring-hours"
								x1="0"
								y1="-100"
								x2="0"
								y2="-125" />
						</g>
						<g transform="rotate(120)">
							<line
								class="clock--ring-hours"
								x1="0"
								y1="-100"
								x2="0"
								y2="-125" />
						</g>
						<g transform="rotate(150)">
							<line
								class="clock--ring-hours"
								x1="0"
								y1="-100"
								x2="0"
								y2="-125" />
						</g>
						<g transform="rotate(210)">
							<line
								class="clock--ring-hours"
								x1="0"
								y1="-100"
								x2="0"
								y2="-125" />
						</g>
						<g transform="rotate(240)">
							<line
								class="clock--ring-hours"
								x1="0"
								y1="-100"
								x2="0"
								y2="-125" />
						</g>
						<g transform="rotate(300)">
							<line
								class="clock--ring-hours"
								x1="0"
								y1="-100"
								x2="0"
								y2="-125" />
						</g>
						<g transform="rotate(330)">
							<line
								class="clock--ring-hours"
								x1="0"
								y1="-100"
								x2="0"
								y2="-125" />
						</g>
						<text
							class="clock--branding-title"
							x="-45"
							y="-60">
							World Clock
						</text>
						<text
							class="clock--branding-author"
							x="-28"
							y="-45">
							By Aniqa
						</text>
						<rect
							class="clock--date-bg"
							height="24"
							width="105"
							rx="6"
							x="-50"
							y="40" />
						<text
							class="clock--date"
							x="-40"
							y="57"></text>
						<line
							class="clock--hand-minute clock--hand"
							x1="0"
							y1="2"
							x2="0"
							y2="-90" />
						<line
							class="clock--hand-hour clock--hand"
							x1="0"
							y1="2"
							x2="0"
							y2="-50" />
						<line
							class="clock--hand-second clock--hand"
							x1="0"
							y1="10"
							x2="0"
							y2="-105" />
						<circle
							class="clock--center-ring"
							r="3" />
						<text
							class="clock--digital clock--digital-time"
							x="-90"
							y="172"></text>
						<text
							class="clock--digital clock--digital-s"
							x="25"
							y="172"></text>
						<text
							class="clock--am"
							x="40"
							y="192">
							AM
						</text>
						<text
							class="clock--pm"
							x="70"
							y="192">
							PM
						</text>
					</svg>
				</div>
				<div class="tz-data-wrapper">
					<h3>Current Date</h3>
					<ul>
						<li>
							<span id="tz-label">Timezone</span>:
							<span id="tz-official-name"></span>
						</li>
						<li>Compared to you: <span id="tz-relative"></span></li>
						<li>Right now: <span id="tz-status"></span></li>
						<li>Daylight Saving Time: <span id="tz-daylight"></span></li>
					</ul>
					<div class="time-card--actions">
						<button
							type="button"
							class="pin-button"
							id="pin-btn"
							aria-pressed="false">
							Pin City
						</button>
						<a
							id="tz-google"
							href="https://www.google.com"
							target="_blank"
							rel="noopener noreferrer"
							>Search on Google</a
						>
					</div>
				</div>
			</section>
			<div class="timezone-wrapper">
				<section class="shift-card">
					<div class="shift-card--heading">
						<label for="shift-range">Shift Time</label>
						<div class="shift-card--controls">
							<output
								id="shift-label"
								for="shift-range"
								>Now</output
							>
							<button
								type="button"
								class="dark-button"
								id="shift-reset-btn"
								disabled>
								Back to Now
							</button>
						</div>
					</div>
					<input
						id="shift-range"
						type="range"
						min="-720"
						max="720"
						step="15"
						value="0"
						aria-valuetext="Now" />
					<div
						class="shift-card--scale"
						aria-hidden="true">
						<span>−12h</span><span>Now</span><span>+12h</span>
					</div>
				</section>

				<section aria-labelledby="pinned-heading">
					<div class="section-heading">
						<h2 id="pinned-heading">Pinned</h2>
						<span id="pinned-count"></span>
					</div>
					<div
						class="timezone-button-group timezone-button-group--pinned"
						id="pinned-group"></div>
				</section>

				<section aria-labelledby="explore-heading">
					<div class="section-heading">
						<h2 id="explore-heading">Explore</h2>
						<button
							type="button"
							class="option-button"
							id="shuffle-tz-btn">
							Shuffle Timezones
						</button>
					</div>
					<div
						class="timezone-button-group"
						id="explore-group"></div>
				</section>
			</div>
		</main>
		<footer>
			Built by
			<a
				href="https://aniqa.dev"
				target="_blank"
				rel="noopener noreferrer">
				Aniqa</a
			>
			<br />
			<small
				>View
				<a
					href="https://github.com/aniqatc/world-clock"
					target="_blank"
					rel="noopener noreferrer"
					>Source Code</a
				></small
			>
		</footer>
	</body>
</html>
